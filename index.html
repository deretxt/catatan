<!DOCTYPE html>
<html lang="id" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Xnotes</title>

  <!-- PWA / APP ICON -->
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.ico" />

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-title" content="Xnotes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="theme-color" content="#111827" />

  <link rel="manifest" href="./site.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

  <div class="container mx-auto p-4 sm:p-6 lg:p-8">

    <!-- HEADER -->
    <header class="mb-6 sm:mb-8">

      <h1 class="text-2xl sm:text-3xl font-bold text-blue-400 tracking-tight">
        Xnotes
      </h1>

      <p class="text-gray-400 mt-1 text-sm sm:text-base">
        Catatan transaksi ALOOO ID
      </p>

    </header>

    <!-- MAIN -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">

      <!-- LEFT PANEL -->
      <div class="space-y-6">

        <!-- FORM -->
        <div class="bg-gray-800 p-5 sm:p-6 rounded-2xl shadow-lg border border-gray-700">

          <h2 class="text-xl font-semibold mb-5 text-blue-400">
            Tambah Transaksi
          </h2>

          <form id="transaction-form" class="space-y-4">

            <input
              type="text"
              id="product-name"
              placeholder="Nama Produk"
              required
              class="w-full px-4 py-3 text-base bg-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

            <input
              type="text"
              id="cost-price"
              placeholder="Harga Modal (Rp)"
              required
              class="w-full px-4 py-3 text-base bg-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

            <input
              type="text"
              id="sell-price"
              placeholder="Harga Jual (Rp)"
              required
              class="w-full px-4 py-3 text-base bg-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

            <input
              type="text"
              id="customer-name"
              placeholder="Nama Customer"
              required
              class="w-full px-4 py-3 text-base bg-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

            <button
              type="submit"
              class="w-full bg-blue-600 py-3 rounded-xl hover:bg-blue-700 transition font-medium">
              Simpan Transaksi
            </button>

            <button
              type="button"
              id="reset-transactions"
              class="w-full bg-red-600 py-3 rounded-xl hover:bg-red-700 transition font-medium">
              Reset Transaksi
            </button>

          </form>
        </div>

        <!-- TOTAL PROFIT -->
        <div class="bg-green-900 border border-green-700 p-6 rounded-2xl shadow-lg">

          <h3 class="text-lg font-semibold text-green-100">
            Total Keuntungan
          </h3>

          <p id="total-profit" class="text-3xl font-bold mt-2 text-white">
            Rp 0
          </p>

        </div>

        <!-- LEADERBOARD -->
        <div class="bg-blue-900 border border-blue-700 p-5 sm:p-6 rounded-2xl shadow-lg">

          <div class="flex justify-between items-center mb-4 gap-3">

            <h3 class="text-lg font-semibold">
              🏆 Produk Terlaris
            </h3>

            <div class="flex items-center gap-2">

              <select
                id="leaderboardLimit"
                class="bg-gray-800 px-2 py-2 rounded-lg text-sm outline-none">

                <option value="10">Top 10</option>
                <option value="20">Top 20</option>

              </select>

              <button
                id="reset-leaderboard"
                class="bg-yellow-500 hover:bg-yellow-600 px-3 py-2 rounded-lg text-xs font-medium transition">

                Reset

              </button>

            </div>

          </div>

          <div class="overflow-y-auto max-h-72 pr-1">

            <table class="w-full text-sm sm:text-base">

              <thead>

                <tr class="border-b border-blue-700 text-left">

                  <th class="py-2">Rank</th>
                  <th>Produk</th>
                  <th>Terjual</th>

                </tr>

              </thead>

              <tbody id="leaderboard-body"></tbody>

            </table>

          </div>

        </div>

      </div>

      <!-- RIGHT PANEL -->
      <div class="lg:col-span-2">

        <div class="bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-lg border border-gray-700">

          <div class="flex items-center justify-between mb-5">

            <h2 class="text-xl font-semibold text-blue-400">
              Riwayat Transaksi
            </h2>

            <span class="text-xs sm:text-sm text-gray-400">
              Mobile Friendly
            </span>

          </div>

          <!-- DESKTOP TABLE -->
          <div class="hidden md:block overflow-x-auto rounded-xl border border-gray-700">

            <table class="min-w-full text-sm">

              <thead class="bg-gray-700 text-gray-200">

                <tr>

                  <th class="px-4 py-3 text-left">No</th>
                  <th class="px-4 py-3 text-left">Tanggal</th>
                  <th class="px-4 py-3 text-left">Produk</th>
                  <th class="px-4 py-3 text-left">Modal</th>
                  <th class="px-4 py-3 text-left">Jual</th>
                  <th class="px-4 py-3 text-left">Untung</th>
                  <th class="px-4 py-3 text-left">Customer</th>
                  <th class="px-4 py-3 text-left">Opsi</th>

                </tr>

              </thead>

              <tbody id="transaction-table-body"></tbody>

            </table>

          </div>

          <!-- MOBILE CARD -->
          <div
            id="transaction-mobile-list"
            class="space-y-4 md:hidden">

          </div>

          <!-- PAGINATION -->
          <div class="mt-6 flex items-center justify-between gap-3">

            <button
              id="prevPage"
              class="flex-1 sm:flex-none px-4 py-3 bg-gray-700 rounded-xl hover:bg-gray-600 transition disabled:opacity-50">

              Sebelumnya

            </button>

            <span
              id="pageIndicator"
              class="text-sm text-gray-300">

            </span>

            <button
              id="nextPage"
              class="flex-1 sm:flex-none px-4 py-3 bg-gray-700 rounded-xl hover:bg-gray-600 transition disabled:opacity-50">

              Berikutnya

            </button>

          </div>

        </div>

      </div>

    </main>

  </div>

  <script src="app.js"></script>

</body>

</html>
