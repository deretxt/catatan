<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xnotes By Dere</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config (SET POPPINS AS DEFAULT FONT) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 font-sans transition-colors duration-300">
  <div class="container mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- HEADER -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-blue-400">Xnotes</h1>
      <p class="text-gray-400 mt-1">Catatan transaksi ALOOO ID - Edisi Ramadan</p>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- LEFT PANEL -->
      <div class="space-y-6">
        
        <!-- FORM -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
          <h2 class="text-xl font-semibold mb-4 text-blue-400">Tambah Transaksi</h2>
          <form id="transaction-form" class="space-y-4">
            
            <input type="text" id="product-name" placeholder="Nama Produk" required 
              class="w-full px-3 py-2 bg-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">

            <input type="text" id="cost-price" placeholder="Harga Modal (Rp)" required 
              class="w-full px-3 py-2 bg-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">

            <input type="text" id="sell-price" placeholder="Harga Jual (Rp)" required 
              class="w-full px-3 py-2 bg-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">

            <input type="text" id="customer-name" placeholder="Nama Customer" required 
              class="w-full px-3 py-2 bg-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">

            <button type="submit" 
              class="w-full bg-blue-600 py-2 rounded-md hover:bg-blue-700 transition">
              Simpan Transaksi
            </button>

            <button type="button" id="reset-transactions" 
              class="w-full bg-red-600 py-2 rounded-md hover:bg-red-700 transition">
              Reset Semua
            </button>

          </form>
        </div>

        <!-- TOTAL PROFIT -->
        <div class="bg-green-900 border-l-4 border-green-500 p-6 rounded-xl shadow-lg">
          <h3 class="text-lg font-semibold">Total Keuntungan</h3>
          <p id="total-profit" class="text-3xl font-bold mt-2">Rp 0</p>
        </div>

        <!-- LEADERBOARD -->
        <div class="bg-yellow-900 border-l-4 border-yellow-500 p-6 rounded-xl shadow-lg">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold">🏆 Klasemen Customer THR</h3>
            <select id="leaderboardLimit" 
              class="bg-gray-800 px-2 py-1 rounded text-sm focus:ring-2 focus:ring-yellow-400 outline-none">
              <option value="10">Top 10</option>
              <option value="20">Top 20</option>
            </select>
          </div>

          <div class="overflow-y-auto max-h-64">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-yellow-700">
                  <th class="py-1 text-left">Rank</th>
                  <th class="text-left">Customer</th>
                  <th class="text-left">Total</th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- RIGHT PANEL -->
      <div class="lg:col-span-2">
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg overflow-x-auto">
          <h2 class="text-xl font-semibold mb-4 text-blue-400">Riwayat Transaksi</h2>

          <table class="min-w-full text-sm">
            <thead class="bg-gray-700">
              <tr>
                <th class="px-4 py-2 text-left">No</th>
                <th class="px-4 py-2 text-left">Tanggal</th>
                <th class="px-4 py-2 text-left">Produk</th>
                <th class="px-4 py-2 text-left">Modal</th>
                <th class="px-4 py-2 text-left">Jual</th>
                <th class="px-4 py-2 text-left">Untung</th>
                <th class="px-4 py-2 text-left">Customer</th>
                <th class="px-4 py-2 text-left">Opsi</th>
              </tr>
            </thead>
            <tbody id="transaction-table-body"></tbody>
          </table>

          <!-- PAGINATION -->
          <div class="mt-4 flex justify-between items-center">
            <button id="prevPage" 
              class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition">
              Sebelumnya
            </button>

            <span id="pageIndicator" class="text-sm"></span>

            <button id="nextPage" 
              class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 transition">
              Berikutnya
            </button>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
